[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-repro"
dynamic = ["version"]
description = "Reproduce bugs, verify fixes, and replay evidence Capsules."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Repo Repro contributors" }]
keywords = ["bugs", "reproduction", "pytest", "go", "github"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "pydantic>=2.7,<3",
    "GitPython>=3.1.43,<4",
]

[project.urls]
Homepage = "https://github.com/NovolineGast/RepoRepro"
Repository = "https://github.com/NovolineGast/RepoRepro"
Issues = "https://github.com/NovolineGast/RepoRepro/issues"
Changelog = "https://github.com/NovolineGast/RepoRepro/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "build>=1.2,<2",
    "twine>=6,<7",
]
qa = [
    "pytest-cov>=7,<8",
    "bandit>=1.8,<2",
    "pip-audit>=2.9,<3",
]

[project.scripts]
repro = "repo_repro.cli:app"

[tool.setuptools.dynamic]
version = { attr = "repo_repro.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_repro = ["py.typed"]
"repo_repro.reproduction" = ["pytest_plugin.txt"]

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["docker_integration: real Linux Docker daemon and explicitly approved image required"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["docs", ".tools", ".repo-repro", "reports"]

[tool.coverage.run]
source = ["repo_repro"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "examples", "scripts"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
